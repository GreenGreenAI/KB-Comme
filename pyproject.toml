[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeflow"
version = "0.1.0"
description = "Evidence-first trade finance decision support foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Analysis notebooks only. The library and its tests stay dependency-free so CI
# runs without installing anything (ADR-0003).
[project.optional-dependencies]
analysis = ["jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

