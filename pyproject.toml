[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeflow"
version = "0.1.0"
description = "Evidence-first trade finance decision support foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Analysis notebooks only. The library and its tests stay dependency-free so CI
# runs without installing anything (ADR-0003).
[project.optional-dependencies]
analysis = ["jupyter", "matplotlib"]
# Web application only. domain/tools/knowledge stay dependency-free so CI runs
# the calculation and rule tests without installing anything or holding a key.
app = [
    "fastapi==0.135.2",
    "pydantic==2.12.4",
    "uvicorn[standard]",
    "anthropic",
]

[tool.setuptools.packages.find]
where = ["src"]

