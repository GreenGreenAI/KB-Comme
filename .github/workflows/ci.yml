name: tradeflow-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tradeflow
          POSTGRES_USER: tradeflow
          POSTGRES_DB: tradeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeflow -d tradeflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -e '.[app]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Run tests
        env:
          PYTHONPATH: src
          TRADEFLOW_TEST_POSTGRES_URL: postgresql://tradeflow:tradeflow@127.0.0.1:5432/tradeflow_test
        run: python -W error::DeprecationWarning -m unittest discover -s tests -t . -v
      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Check rulepack readiness
        env:
          PYTHONPATH: src
        run: python scripts/check_rulepacks.py
