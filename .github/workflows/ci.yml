name: tradeflow-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Check rulepack readiness
        env:
          PYTHONPATH: src
        run: python scripts/check_rulepacks.py
